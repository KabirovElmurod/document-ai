version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: document_ai_postgres
    environment:
      POSTGRES_USER: document_ai
      POSTGRES_PASSWORD: document_ai_password
      POSTGRES_DB: document_ai
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: document_ai_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
